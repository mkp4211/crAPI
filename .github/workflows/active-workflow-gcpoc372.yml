name: Active Scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  active-scan:
    runs-on: ubuntu-latest
    env:
      ENV_ID: "91505b25-d7f5-4531-b371-8886fb2c4e4f"
      ACTIVE_REGISTRY_URL: "us-central1-docker.pkg.dev/noname-artifacts/nns-docker"
      ACTIVE_REGISTRY_USER: "_json_key_base64"
      ACTIVE_REGISTRY_PASSWORD: ""
      ACTIVE_API_URL: "https://gcpoc.nonamesec.com/active"
      CORE_CLI_CLIENT_ID: "200b0f836b9b722688a91c0b87ad1c1ae1fd0bf4441a1f994b64880783919bc3"
      CORE_CLI_CLIENT_SECRET: "1415fed6a2a2833bdeeb509be37abe13d321795ecfeecc42dbe13a04158465e7b4be9091302bc1545d942882e3ace4f1e49be61fcbc569c5038f29fdb5df4712"
      ACTIVE_BACKEND_URI: "https://gcpoc.nonamesec.com/active/backend"
      TEST_GROUP_ID: "892b51de-67cf-4328-beea-3ade61bcdeb2"
      BRANCH_NAME: "${{ github.ref_name }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Active Image Repository
        shell: bash
        run: |
          printf '%s' "$ACTIVE_REGISTRY_PASSWORD" | docker login -u "$ACTIVE_REGISTRY_USER" --password-stdin "$ACTIVE_REGISTRY_URL"

      - name: Run Active Scan
        shell: bash
        run: |
          docker run \
            --network=host \
            -e ACTIVE_BACKEND_URI="$ACTIVE_BACKEND_URI" \
            -e CORE_CLI_CLIENT_ID="$CORE_CLI_CLIENT_ID" \
            -e CORE_CLI_CLIENT_SECRET="$CORE_CLI_CLIENT_SECRET" \
            -v "$(pwd)/akamai:/akamai" \
            "$ACTIVE_REGISTRY_URL/active-cli:$(curl -k "$ACTIVE_API_URL/backend/version")" \
            scan \
            --api-url="$ACTIVE_API_URL" \
            --env-id="$ENV_ID" \
            --test-group-id="$TEST_GROUP_ID" \
            --app-version="$BRANCH_NAME" \
            --verbose
