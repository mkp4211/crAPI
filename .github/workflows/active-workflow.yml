name: Active Scan

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  active-scan:
    runs-on: ubuntu-latest

    env:
      # 可选：临时允许使用 Node 20，消除 Deprecation 警告
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- 调试：检查 Secret 是否被正确注入（仅显示长度） ----
      - name: Debug ACTIVE_REGISTRY_PASSWORD
        run: |
          if [ -n "${{ secrets.ACTIVE_REGISTRY_PASSWORD }}" ]; then
            echo "✅ ACTIVE_REGISTRY_PASSWORD is set (length: ${#{{ secrets.ACTIVE_REGISTRY_PASSWORD }}})"
          else
            echo "❌ ACTIVE_REGISTRY_PASSWORD is empty or not set"
            exit 1
          fi

      # ---- 提前登录到 Google Artifact Registry，验证凭据 ----
      - name: Login to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key_base64   # 与 active_registry_user 保持一致
          password: ${{ secrets.ACTIVE_REGISTRY_PASSWORD }}
        # 如果此步失败，则整个 Job 失败，错误原因清晰可见

      # ---- 运行 Active Scan（无需再单独登录） ----
      - name: Run Active Scan
        uses: nonamesec/active-scan-action@v1
        with:
          active_registry_url: "us-central1-docker.pkg.dev/noname-artifacts/nns-docker"
          active_registry_user: "_json_key_base64"
          active_registry_password: ${{ secrets.ACTIVE_REGISTRY_PASSWORD }}
          active_api_url: "https://alitest.nonamesec.com/active"
